<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>План чи Прогноз — фінансова гра</title>
<meta name="description" content="Командна гра для пари з фінансового планування та прогнозування: проєктор, телефони студентів і пульт викладача.">
<meta name="theme-color" content="#1E1446">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23E5007D'/%3E%3Cpath d='M8 8h48v40l-6-6-6 6-6-6-6 6-6-6-6 6-6-6-6 6z' fill='%23FFA41B'/%3E%3Ccircle cx='32' cy='24' r='7' fill='%23E5007D'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com">
<link rel="preconnect" href="https://plata-che-default-rtdb.firebaseio.com">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Golos+Text:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --night:#1E1446; --night2:#2A1D5C; --ink:#0E0A24; --paper:#FFF3DC; --paper-dim:#CFC3E6;
  --rosa:#E5007D; --cempa:#FFA41B; --turq:#00A7A0; --green:#2FBF71; --red:#FF4D5E;
  --line:#3B2D78;
  --disp:"Dela Gothic One", "Arial Black", system-ui, sans-serif;
  --body:"Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  /* aliases used by app.js inline styles */
  --gold:var(--cempa); --cream:var(--paper); --dim:var(--paper-dim); --card:var(--night2);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--night);color:var(--paper);font-family:var(--body);font-size:16px;line-height:1.45;min-height:100vh;min-height:100dvh}
h1,h2,h3,.title-big,.title-small,.lot-name,.raid-head,.duel-head,.lav-head,.reveal-big,.barrel-result,.phase-head,.pod-name,.terr-name,.adm-title{font-family:var(--disp);font-weight:400;letter-spacing:.01em}
:focus-visible{outline:3px solid var(--cempa);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}

/* папель-пікадо: гірлянда прапорців */
.papel{height:44px;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22180%22%20height%3D%2244%22%20viewBox%3D%220%200%20180%2044%22%3E%3Cpath%20d%3D%22M0%203%20Q90%209%20180%203%22%20stroke%3D%22%23FFF3DC%22%20stroke-width%3D%221.5%22%20fill%3D%22none%22%20opacity%3D%22.7%22/%3E%3Cpath%20d%3D%22M4%205%20L56%205%20L56%2038%20L56.0%2038%20L49.5%2032%20L43.0%2038%20L36.5%2032%20L30.0%2038%20L23.5%2032%20L17.0%2038%20L10.5%2032%20L4.0%2038%20L4%2038%20Z%22%20fill%3D%22%23E5007D%22/%3E%3Ccircle%20cx%3D%2230.0%22%20cy%3D%2216%22%20r%3D%224.5%22%20fill%3D%22%231E1446%22/%3E%3Cpath%20d%3D%22M16.0%2026%20l4%20-4%20l4%204%20l-4%204%20Z%20M44.0%2026%20l-4%20-4%20l-4%204%20l4%204%20Z%22%20fill%3D%22%231E1446%22/%3E%3Ccircle%20cx%3D%2216.0%22%20cy%3D%2213%22%20r%3D%221.8%22%20fill%3D%22%231E1446%22/%3E%3Ccircle%20cx%3D%2244.0%22%20cy%3D%2213%22%20r%3D%221.8%22%20fill%3D%22%231E1446%22/%3E%3Cpath%20d%3D%22M64%205%20L116%205%20L116%2038%20L116.0%2038%20L109.5%2032%20L103.0%2038%20L96.5%2032%20L90.0%2038%20L83.5%2032%20L77.0%2038%20L70.5%2032%20L64.0%2038%20L64%2038%20Z%22%20fill%3D%22%23FFA41B%22/%3E%3Ccircle%20cx%3D%2290.0%22%20cy%3D%2216%22%20r%3D%224.5%22%20fill%3D%22%231E1446%22/%3E%3Cpath%20d%3D%22M76.0%2026%20l4%20-4%20l4%204%20l-4%204%20Z%20M104.0%2026%20l-4%20-4%20l-4%204%20l4%204%20Z%22%20fill%3D%22%231E1446%22/%3E%3Ccircle%20cx%3D%2276.0%22%20cy%3D%2213%22%20r%3D%221.8%22%20fill%3D%22%231E1446%22/%3E%3Ccircle%20cx%3D%22104.0%22%20cy%3D%2213%22%20r%3D%221.8%22%20fill%3D%22%231E1446%22/%3E%3Cpath%20d%3D%22M124%205%20L176%205%20L176%2038%20L176.0%2038%20L169.5%2032%20L163.0%2038%20L156.5%2032%20L150.0%2038%20L143.5%2032%20L137.0%2038%20L130.5%2032%20L124.0%2038%20L124%2038%20Z%22%20fill%3D%22%2300A7A0%22/%3E%3Ccircle%20cx%3D%22150.0%22%20cy%3D%2216%22%20r%3D%224.5%22%20fill%3D%22%231E1446%22/%3E%3Cpath%20d%3D%22M136.0%2026%20l4%20-4%20l4%204%20l-4%204%20Z%20M164.0%2026%20l-4%20-4%20l-4%204%20l4%204%20Z%22%20fill%3D%22%231E1446%22/%3E%3Ccircle%20cx%3D%22136.0%22%20cy%3D%2213%22%20r%3D%221.8%22%20fill%3D%22%231E1446%22/%3E%3Ccircle%20cx%3D%22164.0%22%20cy%3D%2213%22%20r%3D%221.8%22%20fill%3D%22%231E1446%22/%3E%3C/svg%3E") repeat-x 0 0/180px 44px}

.dim{color:var(--paper-dim)} .small{font-size:.875em}
.title-big{font-size:clamp(40px,8.5vw,104px);line-height:.95;text-align:center;color:var(--paper);margin-top:12px;
  text-shadow:4px 4px 0 var(--rosa),8px 8px 0 var(--ink)}
.title-small{color:var(--cempa);font-size:20px;line-height:1.1}
.subtitle{text-align:center;color:var(--paper-dim);font-size:clamp(15px,2vw,21px);margin:18px auto 0;max-width:42ch}

/* кнопки: плоскі, чорнильна рамка, «друкований» зсув */
.btn{background:var(--paper);color:var(--ink);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);
  min-height:44px;padding:10px 16px;border-radius:8px;font:700 16px/1.2 var(--body);cursor:pointer;margin:4px 2px}
.btn:hover{background:#fff}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.big{width:100%;padding:16px;font-size:18px;margin-top:12px}
.btn.mini{min-height:34px;padding:5px 10px;font-size:13px;box-shadow:2px 2px 0 var(--ink)}
.btn.cur{background:var(--cempa)}
.btn.gold{background:var(--cempa)}
.btn.yes{background:var(--green);color:var(--ink)} .btn.no{background:var(--red);color:var(--ink)}
.danger-btn{background:var(--rosa);color:var(--paper)}
.inp{width:100%;min-height:48px;padding:12px 14px;font:500 17px var(--body);border-radius:8px;border:3px solid var(--ink);
  background:var(--paper);color:var(--ink);margin:8px 0}
.timer{font:700 1.2em var(--body);font-variant-numeric:tabular-nums;color:var(--cempa)}
.timer.danger{color:var(--red);animation:blink .5s infinite alternate}
@keyframes blink{from{opacity:1}to{opacity:.45}}

/* головна */
.home{max-width:1040px;margin:0 auto;padding:28px 20px 40px;text-align:center}
.home-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:22px;margin:44px 0 28px}
.home-card{display:block;text-decoration:none;color:var(--ink);background:var(--paper);border:4px solid var(--ink);
  border-radius:10px;box-shadow:6px 6px 0 var(--ink);padding:26px 22px 22px;text-align:left;transition:transform .12s}
.home-card:hover{transform:translate(-2px,-2px)}
.home-card:nth-child(1){border-top:14px solid var(--turq)}
.home-card:nth-child(2){border-top:14px solid var(--rosa)}
.home-card:nth-child(3){border-top:14px solid var(--cempa)}
.hc-icon{font-size:44px;line-height:1}
.home-card h3{margin:12px 0 4px;font-size:26px}
.home-card p{color:#4A3F6B}
.mode-badge{display:inline-block;border:2px solid var(--line);border-radius:999px;padding:6px 16px;color:var(--paper-dim);font-size:14px}

/* лобі проєктора */
.proj-lobby{text-align:center;padding:10px 20px 30px}
.qr-box{display:inline-block;background:var(--paper);padding:16px;border:5px solid var(--ink);box-shadow:8px 8px 0 var(--rosa);border-radius:10px;margin:22px 14px}
.qr-box img,.qr-box canvas{display:block;margin:0 auto}
.qr-url{color:var(--ink);font-weight:700;margin-top:10px;font-size:13px;word-break:break-all;max-width:230px}
.lobby-teams{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:10px}
.lob-team{background:var(--night2);border:3px solid var(--tc);border-radius:10px;padding:10px 14px;min-width:180px;text-align:left}
.lt-head{color:var(--tc);font-weight:800;border-bottom:2px solid var(--line);padding-bottom:6px;margin-bottom:6px}
.lt-m{padding:2px 0}

/* ігровий екран проєктора */
.proj-game{display:grid;grid-template-columns:1fr 340px;grid-template-rows:auto 1fr;height:calc(100vh - 44px);height:calc(100dvh - 44px);gap:12px;padding:12px}
.proj-top{grid-column:1/3;display:flex;justify-content:space-between;align-items:center;background:var(--ink);border-radius:10px;padding:10px 18px}
.round-badge{background:var(--cempa);color:var(--ink);font-weight:800;border-radius:6px;padding:4px 12px}
.proj-main{overflow:auto;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px}
.proj-side{display:flex;flex-direction:column;gap:12px;overflow:auto}
.center-msg{font-size:clamp(20px,3vw,34px);text-align:center;line-height:1.4}

/* рейтинг */
.lb{display:flex;flex-direction:column;gap:6px}
.lb-row{display:flex;align-items:center;gap:8px;background:var(--night2);border-left:8px solid var(--tc);border-radius:6px;padding:8px 10px;font-size:16px}
.lb-row.turn{background:var(--paper);color:var(--ink)}
.lb-row.turn .lb-pos,.lb-row.turn .lb-n{color:#4A3F6B}
.lb-pos{font-weight:800;color:var(--paper-dim);width:18px}.lb-name{flex:1;font-weight:700}
.lb-cash{font-weight:800;color:var(--cempa);font-variant-numeric:tabular-nums}
.lb-row.turn .lb-cash{color:var(--rosa)}
.lb-dirty{color:#FFC46B;font-size:13px}.lb-debt{color:#FF8A95;font-size:13px}
.lb-n{color:var(--paper-dim);font-size:12px}
.log-box{background:var(--ink);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--paper-dim)}
.log-box.tall{min-height:200px;max-height:45vh;overflow:auto}
.log-line{padding:4px 0;border-bottom:1px solid #251A52}

/* ТЕРИТОРІЇ = КАРТКИ ЛОТЕРЕЇ */
.terr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;width:100%;max-width:920px;counter-reset:terr}
.terr{position:relative;background:var(--paper);color:var(--ink);border:4px solid var(--ink);border-radius:6px;
  box-shadow:0 0 0 4px var(--paper),0 0 0 7px var(--ink);margin:7px;padding:30px 10px 0;text-align:center;
  display:flex;flex-direction:column;align-items:center;overflow:hidden}
.terr::before{counter-increment:terr;content:counter(terr);position:absolute;top:6px;left:9px;font:400 20px var(--disp)}
.terr-ico{font-size:44px;line-height:1;width:78px;height:78px;display:grid;place-items:center;border-radius:50%;
  background:var(--oc,transparent);border:3px solid var(--ink);margin-bottom:8px}
.terr-sub{font-size:12px;color:#4A3F6B;margin:2px 0 6px;min-height:2.6em}
.terr-own{font-size:13px;font-weight:700}
.terr-left{font-size:12px;color:#4A3F6B;margin-bottom:10px}
.terr-name{order:9;align-self:stretch;margin:0 -10px;background:var(--ink);color:var(--paper);font-size:20px;padding:8px 4px 9px}
.terr.clickable{cursor:pointer}.terr.clickable:active{transform:scale(.97)}
.terr.picked{box-shadow:0 0 0 4px var(--cempa),0 0 0 8px var(--ink)}
.terr.empty{opacity:.4}

/* барабан */
.barrel-wrap{text-align:center}
.barrel-result{font-size:clamp(24px,4vw,44px);margin-top:16px;animation:pop .4s}
.lvl-easy{color:var(--green)}.lvl-mid{color:var(--cempa)}.lvl-deadly{color:var(--rosa)}.lvl-blank{color:var(--paper)}
@keyframes pop{from{transform:scale(.3);opacity:0}}

/* питання */
.q-card{background:var(--paper);color:var(--ink);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--rosa);border-radius:10px;padding:18px;max-width:920px;width:100%}
.q-card.proj .q-text{font-size:clamp(20px,2.6vw,32px)}
.q-meta{color:#4A3F6B;font-size:14px;margin-bottom:8px}
.q-text{font-size:19px;font-weight:700;line-height:1.35;margin-bottom:14px;max-width:70ch}
.q-card .dim{color:#4A3F6B}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:#fff;border:3px solid var(--ink);color:var(--ink);min-height:48px;padding:11px 12px;border-radius:8px;font:500 16px/1.35 var(--body);cursor:pointer}
.opt.sel{background:var(--cempa)}
.opt:disabled{cursor:default}
.hint{color:#4A3F6B;font-size:13px;margin-top:6px}
.order-item{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--ink);border-radius:8px;padding:9px 10px;margin:6px 0}
.order-num{background:var(--ink);color:var(--paper);font-weight:800;border-radius:5px;padding:2px 8px}
.order-btns{margin-left:auto;display:flex;gap:4px}
.ob{min-width:40px;min-height:40px;background:var(--paper);border:2px solid var(--ink);color:var(--ink);border-radius:6px;cursor:pointer;font-size:15px}
.match-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0;align-items:center}
.match-left{background:#fff;border:3px solid var(--ink);border-radius:8px;padding:10px;font-size:14px}
.match-sel{min-height:44px;padding:8px;border-radius:8px;background:#fff;color:var(--ink);border:3px solid var(--ink);font:500 14px var(--body);max-width:100%}
.sort2-head{display:flex;justify-content:space-between;font-weight:800;margin-bottom:6px;font-size:14px}
.sort2-row{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fff;border:3px solid var(--ink);border-radius:8px;padding:8px 10px;margin:6px 0;font-size:14px}
.s2btns{display:flex;gap:6px}
.s2{width:44px;height:44px;border-radius:8px;border:3px solid var(--ink);background:var(--paper);color:var(--ink);font-weight:800;cursor:pointer}
.s2.sel{background:var(--turq);color:#fff}
.oral-note{background:#fff;border:3px dashed var(--ink);border-radius:8px;padding:14px;text-align:center}
.oral-ready{color:var(--turq);font-weight:800;font-size:22px;text-align:center;margin-top:10px;animation:blink 1s infinite alternate}
.advice{margin-top:10px}.adv-row{color:var(--turq);font-size:14px;padding:2px 0;font-weight:700}
.omerta{background:var(--ink);color:#FFB3BC;border-radius:8px;padding:12px;text-align:center;margin-top:10px}

/* ставки */
.bets-strip{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.bet-chip{background:var(--ink);color:var(--paper);border:3px solid var(--tc);border-radius:999px;padding:4px 12px;font-weight:700;font-size:14px}
.bet-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bet-btn.za{background:var(--green)}.bet-btn.pr{background:var(--red)}
.bet-done{background:var(--ink);color:var(--paper);border-radius:8px;padding:10px;text-align:center;margin-top:8px}

/* результат */
.reveal{text-align:center;padding:30px 24px;border-radius:12px;max-width:820px;width:100%;border:4px solid var(--ink);color:var(--ink)}
.reveal.good{background:var(--green)} .reveal.part{background:var(--cempa)} .reveal.bad{background:var(--rosa);color:var(--paper)}
.reveal-big{font-size:clamp(28px,5vw,56px);line-height:1.05}
.reveal-delta{font:800 clamp(24px,4vw,42px) var(--body);font-variant-numeric:tabular-nums;margin:10px 0}
.reveal-expl{font-size:16px;margin:12px auto 0;line-height:1.45;max-width:62ch}
.nada-res{font-size:24px;font-weight:800;margin-top:8px}

/* події */
.raid-card,.duel-card,.lav-card,.loteria-card{background:var(--paper);color:var(--ink);border:4px solid var(--ink);border-radius:12px;padding:24px;text-align:center;max-width:860px;width:100%}
.raid-card{box-shadow:8px 8px 0 var(--red)} .duel-card{box-shadow:8px 8px 0 var(--cempa)} .lav-card{box-shadow:8px 8px 0 var(--turq);text-align:left}
.raid-head,.duel-head,.lav-head{font-size:clamp(22px,3.4vw,40px);margin-bottom:12px}
.raid-head{color:#C8102E}.duel-head{color:#B85F00}.lav-head{color:#00726D}
.raid-sub{color:#4A3F6B;margin-top:10px}
.raid-card .dim,.duel-card .dim,.lav-card .dim{color:#4A3F6B}
.yn{display:flex;gap:12px;margin-top:14px}.yn .btn{flex:1}
/* лотерея — справжня картка лотереї */
.loteria-card{max-width:340px;padding:16px 16px 0;box-shadow:0 0 0 6px var(--paper),0 0 0 10px var(--ink),14px 14px 0 10px var(--rosa);animation:pop .4s;margin:20px}
.lot-ico{font-size:96px;line-height:1.2;background:var(--turq);border:3px solid var(--ink);border-radius:4px;padding:16px 0}
.lot-text{font-size:19px;margin:12px 0}
.lot-name{font-size:32px;background:var(--ink);color:var(--paper);margin:0 -16px;padding:10px 0 12px}

/* подіум */
.podium-wrap{text-align:center;padding:10px}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:14px;margin-top:30px}
.pod{background:var(--paper);color:var(--ink);border:4px solid var(--ink);border-radius:10px 10px 0 0;padding:16px;width:min(26vw,240px)}
.pod-0{height:310px;box-shadow:0 -10px 0 var(--cempa)}.pod-1{height:250px}.pod-2{height:210px}
.pod-ico{font-size:48px}.pod-name{font-size:20px}
.pod-cash{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}.pod-base{font-size:40px;margin-top:8px}
.final-rest{margin-top:20px;color:var(--paper-dim)}

/* телефон */
.join{max-width:460px;margin:0 auto;padding:20px;text-align:center}
.join .title-small{font-size:26px;color:var(--paper);margin-bottom:6px}
.join-teams{display:grid;gap:10px;margin-top:12px}
.jt{display:flex;justify-content:space-between;align-items:center;background:var(--paper);color:var(--ink);border:3px solid var(--ink);
  border-left:14px solid var(--tc);min-height:56px;padding:12px 14px;border-radius:8px;font:700 17px var(--body);cursor:pointer}
.jt.full{opacity:.4}.jt-n{color:#4A3F6B;font-variant-numeric:tabular-nums}
.play{display:flex;flex-direction:column;min-height:calc(100vh - 44px);min-height:calc(100dvh - 44px)}
.play-top{display:flex;align-items:center;gap:10px;background:var(--ink);border-bottom:5px solid var(--tc);padding:10px 12px;font-weight:800;position:sticky;top:0;z-index:5}
.play-cash{margin-left:auto;color:var(--cempa);font-variant-numeric:tabular-nums}
.exit{background:none;border:2px solid var(--line);color:var(--paper-dim);border-radius:8px;width:36px;height:36px;cursor:pointer}
.play-body{flex:1;padding:14px;display:flex;flex-direction:column;justify-content:center;gap:12px;max-width:560px;width:100%;margin:0 auto}
.play-foot{padding:8px 12px calc(8px + env(safe-area-inset-bottom));color:var(--paper-dim);font-size:13px;border-top:2px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.phase-head{font-size:22px;color:var(--cempa);text-align:center}
.shooter-list{display:grid;gap:8px}
.cap-tools{margin-top:20px}

/* пульт */
.admin{display:grid;grid-template-columns:250px 1fr 310px;gap:12px;padding:12px;align-items:start}
.adm-col{display:flex;flex-direction:column;gap:12px}
.adm-box{background:var(--night2);border:2px solid var(--line);border-radius:10px;padding:12px}
.adm-box .btn{display:block;width:100%;text-align:left}
.adm-box .btn.mini{display:inline-block;width:auto}
.adm-title{color:var(--cempa);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;font-size:17px}
.cheat{background:var(--paper);color:var(--ink);border:3px dashed var(--ink);border-radius:8px;padding:12px}
.cheat-head{font-weight:800;margin-bottom:6px}
.cheat-ans{color:#0B6B3A;font-weight:700;margin:8px 0;line-height:1.5}
.cheat-expl{color:#4A3F6B;font-size:14px;line-height:1.45}
.oral-judge{display:flex;gap:10px;margin-top:10px}.oral-judge .btn{flex:1}
.adm-team{border-left:6px solid var(--tc);background:var(--ink);border-radius:6px;padding:8px;margin-bottom:8px}
.at-head{font-size:14px;margin-bottom:4px}.at-btns{float:right}
.at-m{font-size:14px;padding:4px 6px;border-radius:5px;cursor:pointer}.at-m:hover{background:var(--night2)}.at-m.sil{color:var(--paper-dim)}
.duel-pick{font-size:13px;display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-top:6px}
.duel-pick select{background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:6px;padding:5px;font:500 13px var(--body);max-width:96px}

@media(max-width:900px){.proj-game{grid-template-columns:1fr;height:auto}.proj-top{grid-column:1}.proj-side{flex-direction:row;flex-wrap:wrap}.admin{grid-template-columns:1fr}}
@media(max-width:420px){.terr-grid{grid-template-columns:1fr 1fr;gap:10px}.terr{margin:6px;padding-top:28px}.terr-ico{width:60px;height:60px;font-size:34px}.terr-name{font-size:16px}.match-row{grid-template-columns:1fr}}
/* — доопрацювання після перегляду — */
.lb-row.turn .lb-dirty{color:#9A4F00}.lb-row.turn .lb-debt{color:#B3001B}
.play-top{font-size:15px;gap:8px}.play-top>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.play-cash,.play-top .timer{white-space:nowrap}
.match-row{margin:12px 0}.match-left{background:none;border:0;padding:2px 2px 0;font-weight:700}
body[data-role=projector] .terr-grid{max-width:1120px}
body[data-role=projector] .terr-sub,body[data-role=projector] .terr-own,body[data-role=projector] .terr-left{font-size:15px}
body[data-role=projector] .terr-name{font-size:24px}
body[data-role=projector] .lb-row{font-size:19px;padding:10px 12px}
body[data-role=projector] .log-box{font-size:15px}
body[data-role=projector] .title-small{font-size:24px}
.modal-wrap{position:fixed;inset:0;background:rgba(14,10,36,.75);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--paper);color:var(--ink);border:4px solid var(--ink);box-shadow:8px 8px 0 var(--rosa);border-radius:12px;padding:22px;max-width:420px;width:100%}
.modal-text{font-size:17px;line-height:1.45;margin-bottom:16px}
.modal-btns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
#toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:60;width:min(92vw,460px)}
.toast{background:var(--ink);color:var(--paper);border:3px solid var(--cempa);border-radius:10px;padding:12px 14px;font-weight:700;box-shadow:4px 4px 0 var(--rosa)}
/* — барабан v5 — */
.barrel{position:relative;width:min(46vh,320px);margin:0 auto;padding-top:24px;filter:drop-shadow(7px 7px 0 #0E0A24)}
.barrel .pin{position:absolute;top:0;left:50%;width:42px;transform:translateX(-50%);z-index:2}
.cyl{display:block;width:100%;transform-origin:50% 50%}
.cyl.spinning{animation:cylspin var(--dur) cubic-bezier(.1,.7,.15,1) both}
@keyframes cylspin{from{transform:rotate(0)}to{transform:rotate(var(--rot))}}
.ch.hit{transform-box:fill-box;transform-origin:center;animation:hit .5s ease-out 3}
.ch.hit circle:first-child{stroke:#FFF3DC;stroke-width:6}
@keyframes hit{50%{transform:scale(1.2)}}
.barrel-legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:14px;color:var(--paper-dim);margin-top:12px}
.barrel-result.dim{font-size:20px;font-family:var(--body);color:var(--paper-dim)}
/* — що робити зараз / черга / правила — */
.now-banner{background:var(--cempa);color:var(--ink);font-weight:800;padding:10px 14px;border-bottom:3px solid var(--ink);text-align:center;line-height:1.3}
.queue{background:var(--ink);border-radius:8px;padding:10px 12px}
.queue-title{font-weight:800;margin-bottom:8px}
.queue-row{display:flex;flex-wrap:wrap;gap:6px}
.qchip{border:2px solid var(--tc);border-radius:999px;padding:3px 10px;font-weight:700;font-size:14px}
.qchip.done{opacity:.45}.qchip.done::before{content:"✓ "}
.qchip.cur{background:var(--tc);color:var(--ink)}.qchip.cur::before{content:"▶ "}
.queue-hint{font-size:12px;color:var(--paper-dim);margin-top:8px}
.lobby-grid{display:flex;gap:28px;justify-content:center;align-items:center;flex-wrap:wrap;margin:6px 0 10px}
.lobby-rules{background:var(--paper);color:var(--ink);border:4px solid var(--ink);border-radius:10px;box-shadow:8px 8px 0 var(--turq);padding:18px 22px;max-width:560px;text-align:left}
.lobby-rules h2{font-size:24px;margin-bottom:8px}
.rules{padding-left:22px;line-height:1.45}.rules li{margin:6px 0}
.lobby-rules .rules{font-size:17px}
.rules-box{background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:8px;padding:10px 14px;margin-top:8px}
.rules-box summary{font-weight:800;cursor:pointer;min-height:32px}
.rules-box .rules{font-size:15px;margin-top:6px}
.step-box{background:var(--paper);color:var(--ink);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--cempa)}
.step-box .adm-title{color:var(--rosa)}
.step-text{font-size:16px;line-height:1.45}
.step-btn{background:var(--cempa)}
.lock{max-width:440px;margin:40px auto;padding:24px;background:var(--paper);color:var(--ink);border:4px solid var(--ink);border-radius:12px;box-shadow:8px 8px 0 var(--rosa)}
.lock .title-small{color:var(--ink);font-size:28px;margin-bottom:8px}.lock p{margin-bottom:12px}.lock label{font-weight:700}
.warn-box{background:var(--red);color:var(--ink);font-weight:800;border-color:var(--ink)}
.shadow-box{border-top:3px dashed var(--ink);margin-top:14px;padding-top:12px}
</style>
</head>
<body>
<div id="app"><div class="papel"></div><p style="text-align:center;padding:40px;color:#CFC3E6">Завантаження гри…</p></div>
